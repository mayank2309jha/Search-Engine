name: CI

on:
  push:
  pull_request:

jobs:
  # app/main.py has a hard, unconditional startup dependency on ../data/index.bin
  # (fails loudly by design if it's missing -- see that file's own comment) --
  # and every test in tests/test_api.py imports app.main via the api_client
  # fixture. data/index.bin is a real, 100MB+ build artifact, correctly
  # gitignored (Phase 10) and never checked out here, so a fixture generator
  # materializes a small, valid one before pytest runs -- confirmed necessary
  # by reproducing this exact failure locally (`from app.main import app`
  # raises FileNotFoundError with the real file hidden) before adding this step.
  python-tests:
    name: Python tests (query-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: query-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: query-server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate CI index fixture (data/index.bin doesn't exist in git)
        # PYTHONPATH=. so `tests.fixture_builder` resolves -- pytest.ini gives
        # pytest this for free, but this is a plain script invocation, not pytest.
        run: PYTHONPATH=. python scripts/generate_ci_index_fixture.py

      - name: Run pytest (tokenizer, parser, bm25, ranking, semantic, cpp_reader, api)
        run: pytest --cov=app --cov-report=term-missing

  python-lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: query-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install ruff==0.16.3

      # E9 (real syntax/runtime errors) + F (pyflakes: unused imports, unused
      # locals, undefined names) -- errors, not style opinions. A stricter
      # rule set (import sorting, line length, etc.) is a reasonable follow-up
      # once the codebase has a chance to opt into it deliberately, not
      # something CI should start enforcing retroactively without review.
      - run: ruff check . --select=E9,F

  cpp-build:
    name: C++ build (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libstemmer-dev libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      # No automated C++ test suite exists in this repo yet -- a real, disclosed
      # gap (see query-server's docs-sde/roadmap.md, local to the project owner's
      # machine, not in this repo). This job verifies the engine still builds
      # cleanly on every push, which is the concrete thing CI can check today;
      # add a `ctest`/gtest step here once that suite exists.

  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same fixture the python-tests job uses -- app/main.py hard-requires
      # data/index.bin at import time, and it's correctly gitignored/never
      # committed (Phase 10), so the container has nothing to load without
      # this. fixture_builder.py has zero third-party dependencies (stdlib
      # `struct` only), so no pip install is needed just to generate it.
      - name: Generate CI index fixture
        working-directory: query-server
        run: PYTHONPATH=. python3 scripts/generate_ci_index_fixture.py

      - name: Build image
        run: docker build -t query-server:ci ./query-server

      # Real boot, real requests, a real memory cap -- not just "did it
      # build." mem_limit here is deliberately small (the CI fixture is a
      # 550-byte, 3-document index, nothing like the ~3.9GB real-corpus peak
      # measured locally -- see docs-sde/benchmarks-phase11-12.md) so this
      # also catches a future regression that makes even a trivial boot
      # memory-hungry.
      - name: Boot container
        run: |
          docker run -d --name smoke-test -p 8000:8000 \
            --memory=1g \
            -v "${{ github.workspace }}/data/index.bin:/app/data/index.bin:ro" \
            -e API_KEY=ci-smoke-test-key \
            query-server:ci

      - name: Wait for health, then verify a real authenticated search works
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "healthy after ${i}0s"
              break
            fi
            sleep 10
          done
          curl -sf http://localhost:8000/health || { echo "never became healthy"; docker logs smoke-test; exit 1; }
          curl -sf -H "X-API-Key: ci-smoke-test-key" "http://localhost:8000/search?q=python" >/dev/null \
            || { echo "authenticated search failed"; docker logs smoke-test; exit 1; }
          # 401 without a key is the other half of "auth actually works" --
          # see tests/test_api.py::TestAuth for the same check at the unit level
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/search?q=python)
          [ "$status" = "401" ] || { echo "expected 401 without API key, got $status"; exit 1; }

      - name: Show logs (always, for debugging)
        if: always()
        run: docker logs smoke-test || true

      - name: Cleanup
        if: always()
        run: docker rm -f smoke-test || true

  all-checks-passed:
    name: All checks passed
    needs: [python-tests, python-lint, cpp-build, docker-build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Python tests, lint, the C++ build, and the Docker build/smoke test all passed."
